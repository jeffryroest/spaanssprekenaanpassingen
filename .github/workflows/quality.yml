name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  APP_DEBUG: 'false'

jobs:
  php-quality:
    name: PHP quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Validate project contracts
        run: npm run validate

      - name: Build production assets
        run: npm run build:verify

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  laravel-tests:
    name: Laravel tests (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROADCAST_CONNECTION: "null"
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_DATABASE: spaansspreken_test
      DB_HOST: 127.0.0.1
      DB_PASSWORD: secret
      DB_PORT: 3306
      DB_USERNAME: spaansspreken
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: spaansspreken_test
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root-secret
          MYSQL_USER: spaansspreken
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build production assets
        run: npm run build:verify

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Resolve Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare database
        run: php artisan migrate --force --no-interaction

      - name: Run Laravel test suite
        run: php artisan test --colors=always
